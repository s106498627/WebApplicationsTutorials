<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover the very best in flash storage at Sandish">
    <meta name="keywords" content="Sandish, Flash, Storage, USB">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style-form.css">
    <link rel="stylesheet" href="styles/style-cart.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <script src="scripts/part2.js"></script>
    <script src="scripts/enhancements.js"></script>
    <title>Enquiries</title>
</head>

<body>
    <!-- BEGIN Nav Bar -->
    <nav class="navbar">
        <a href="index.html">
            <!-- limit height to stay in bounds of navbar -->
            <img src="images/sandish_logo.png" alt="Sandish logo, press to home." height="30">
        </a>

        <div class="navbar-link-group">
            <a class="button-link" href=".">Home</a>
            <a class="button-link" href="product.html">Products</a>
            <a class="button-link" href="enquire.html">Enquire</a>
            <a class="button-link" href="enquire2.html">Enquire 2</a>
            <a class="button-link" href="about.html">About</a>
            <a class="button-link" href="enhancements.html">Enhancements</a>
            <a class="button-link" href="enhancements2.html">Enhancements 2</a>
        </div>
    </nav>
    <!-- END Nav Bar -->
    <main>
        <br>
        <h1>Order &amp; Enquiry</h1>
        <!-- validation done by scripts/part2.js. novalidate stops the browser doing simple checks
         POST not GET to not leak form inputs to the address bar. js does the redirect instead. -->

        <form id="enquire-form" action="payment.html" method="post" novalidate>
            <!-- BEGIN Left Column -->
            <div class="form-col">
                <h2><span class="icons-person"></span>Details</h2>
                <div>
                    <label for="first-name">First name</label>
                    <div class="field">
                        <input type="text" id="first-name" name="first-name">
                    </div>
                </div>
                <div>
                    <label for="last-name">Last name</label>
                    <div class="field">
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>
                <div>
                    <label for="email">Email address</label>
                    <div class="field">
                        <input type="text" id="email" name="email" inputmode="email">
                    </div>
                </div>

                <fieldset>
                    <legend>Address</legend>
                    <div>
                        <!-- NOTE: cannot enter unit number for townhouse or apartment ie 2/22 asc street. Letter of the assignment spec. -->
                        <label for="street-address">Street address</label>
                        <div class="field">
                            <input type="text" id="street-address" name="street-address">
                        </div>
                    </div>
                    <div>
                        <label for="suburb">Suburb/town</label>
                        <div class="field">
                            <input type="text" id="suburb" name="suburb">
                        </div>
                    </div>
                    <div>
                        <label for="state">State</label>
                        <select id="state" name="state">
                            <option value="" selected>-- Choose an option --</option>
                            <option value="ACT">ACT</option>
                            <option value="NSW">NSW</option>
                            <option value="NT">NT</option>
                            <option value="QLD">QLD</option>
                            <option value="SA">SA</option>
                            <option value="TAS">TAS</option>
                            <option value="VIC">VIC</option>
                            <option value="WA">WA</option>
                        </select>
                    </div>
                    <div>
                        <label for="postcode">Postcode</label>
                        <div class="field">
                            <input type="text" id="postcode" name="postcode" inputmode="numeric">
                        </div>
                    </div>
                </fieldset>

                <div>
                    <label for="phone">Phone number</label>
                    <div class="field">
                        <input type="text" id="phone" name="phone" inputmode="numeric" placeholder="0123 456 789">
                    </div>
                </div>

                <fieldset>
                    <legend>Preferred contact method</legend>
                    <label>
                        <input type="radio" name="preferred-contact" value="email" checked>
                        Email
                    </label>
                    <label>
                        <input type="radio" name="preferred-contact" value="post">
                        Post
                    </label>
                    <label>
                        <input type="radio" name="preferred-contact" value="phone">
                        Phone
                    </label>
                </fieldset>
            </div>
            <!-- END Left Column -->
            <!-- BEGIN Right Column -->
            <div class="form-col">
                <!-- BEGIN Cart -->
                <section id="cart" class="cart">
                    <h2><span class="icons-cart"></span>Cart</h2>
                    <div id="cart-items" class="cart-list">
                        <!-- add item card, always  last box in list -->
                        <button type="button" id="add-item" class="cart-add">
                            <span class="cart-add-icon icons-add"></span>
                            <span class="cart-add-text">Add item</span>
                        </button>
                    </div>
                </section>

                <!-- NOTE: see https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/template
                 fragment for the cart items above. used in enhancements.js to add another item
                 when hitting the "add" button -->
                <template id="cart-item-template">
                    <section class="cart-item cart-card">
                        <div class="cart-card-header">
                            <h3 class="cart-card-title">Item <span class="cart-item-number"></span></h3>
                            <button type="button" class="icon-button cart-remove"><span
                                    class="icons-delete"></span></button>
                        </div>

                        <p class="cart-label">Product</p>
                        <div class="cart-card-group" role="radiogroup">
                            <label class="cart-card-group-item">
                                <!-- see: https://developer.mozilla.org/en-US/docs/Web/HTML/How_to/Use_data_attributes
                                used to get input field type in the js by getAttribute -->
                                <input type="radio" value="pokemon-usb" data-field="product">
                                <span class="cart-card-group-item-body">
                                    <span class="cart-card-group-item-name">Pokémon USB Drive</span>
                                    <span class="cart-card-group-item-price">$29.95</span>
                                </span>
                            </label>
                            <label class="cart-card-group-item">
                                <input type="radio" value="extreme-usb" data-field="product">
                                <span class="cart-card-group-item-body">
                                    <span class="cart-card-group-item-name">Extreme Encrypted USB Drive</span>
                                    <span class="cart-card-group-item-price">$89.95</span>
                                </span>
                            </label>
                            <label class="cart-card-group-item">
                                <input type="radio" value="classic-usb-a" data-field="product">
                                <span class="cart-card-group-item-body">
                                    <span class="cart-card-group-item-name">Classic USB-A Drive</span>
                                    <span class="cart-card-group-item-price">$14.95</span>
                                </span>
                            </label>
                        </div>

                        <div class="cart-field-row">
                            <label class="cart-field cart-field-select">
                                <select data-field="capacity">
                                    <option value="" selected>Choose storage</option>
                                    <option value="32gb">32 GB (+$0.00)</option>
                                    <option value="64gb">64 GB (+$10.00)</option>
                                    <option value="128gb">128 GB (+$20.00)</option>
                                    <option value="256gb">256 GB (+$35.00)</option>
                                </select>
                                <span class="cart-field-label">Storage</span>
                            </label>
                            <label class="cart-field cart-field-quantity">
                                <input type="text" inputmode="numeric" value="1" data-field="quantity">
                                <span class="cart-field-label">Quantity</span>
                            </label>
                        </div>
                    </section>
                </template>
                <!-- END Cart -->

                <!-- optional extras apply once to the whole order, no selection required -->
                <fieldset>
                    <legend>Order extras</legend>
                    <label>
                        <input type="checkbox" name="extras" value="express-shipping">
                        Express shipping ($9.95)
                    </label>
                    <label>
                        <input type="checkbox" name="extras" value="gift-wrap">
                        Gift wrapping ($4.00)
                    </label>
                    <label>
                        <input type="checkbox" name="extras" value="extended-warranty">
                        Extended 3-year warranty ($12.00)
                    </label>
                </fieldset>

                <div>
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment"
                        placeholder="Enter other instructions or requests if desired..."></textarea>
                </div>

                <!-- part2.js populates this with any errors in form -->
                <div id="enquire-errors" class="error-box" hidden></div>

                <button type="submit" class="button-link">Pay Now</button>
            </div>
            <!-- END Right Column -->
        </form>
    </main>

    <!-- START footer -->
    <footer>
        &copy; 2026 Sandish Pty Ltd.
    </footer>
    <!-- END footer -->
</body>

</html>
