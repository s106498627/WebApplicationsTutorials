<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Document</title>
</head>

<body>
    <!-- BEGIN Nav Bar -->
    <nav class="navbar">
        <a class="navbar-logo" href="index.html">
            <img src="images/sandish_logo.png" alt="Sandish logo, press to home." height="30" />
        </a>

        <div class="navbar-link-group">
            <a class="navbar-link-item" href="product.html">Products</a>
            <a class="navbar-link-item" href="enquire.html">Enquire</a>
            <a class="navbar-link-item" href="about.html">About</a>
            <a class="navbar-link-item" href="enhancements.html">Enhancements</a>
        </div>
    </nav>
    <!-- END Nav Bar -->
    <main>
        <h1>Product Enquiry</h1>
        <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
            <div>
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="first-name" maxlength="25" pattern="[A-Za-z]+"
                    title="Alphabetical characters only" required>
            </div>
            <div>
                <label for="last-name">Last name</label>
                <input type="text" id="last-name" name="last-name" maxlength="25" pattern="[A-Za-z]+"
                    title="Alphabetical characters only" required>
            </div>
            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <fieldset>
                <legend>Address</legend>
                <div>
                    <!-- NOTE: cannot enter unit number for townhouse or apartment. Letter of the assignment spec. -->
                    <label for="street-address">Street address</label>
                    <input type="text" id="street-address" name="street-address" maxlength="40" pattern="[A-Za-z0-9 ]+"
                        title="Letters, numbers, and spaces only" required>
                </div>
                <div>
                    <label for="suburb">Suburb/town</label>
                    <input type="text" id="suburb" name="suburb" maxlength="20" pattern="[A-Za-z0-9 ]+"
                        title="Letters, numbers, and spaces only" required>
                </div>
                <div>
                    <label for="state">State</label>
                    <select id="state" name="state" required>
                        <option value="VIC">VIC</option>
                        <option value="NSW">NSW</option>
                        <option value="QLD">QLD</option>
                        <option value="NT">NT</option>
                        <option value="WA">WA</option>
                        <option value="SA">SA</option>
                        <option value="TAS">TAS</option>
                        <option value="ACT">ACT</option>
                    </select>
                </div>
                <div>
                    <label for="postcode">Postcode</label>
                    <input type="text" id="postcode" name="postcode" inputmode="numeric" maxlength="4"
                        pattern="[0-9]{4}" title="Exactly 4 digits" required>
                </div>
            </fieldset>

            <div>
                <label for="phone">Phone number</label>
                <input type="text" id="phone" name="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{1,10}"
                    title="Up to 10 digits" placeholder="0412 345 678" required>
            </div>

            <fieldset>
                <legend>Preferred contact method</legend>
                <label>
                    <input type="radio" name="preferred-contact" value="email" checked>
                    Email
                </label>
                <label>
                    <input type="radio" name="preferred-contact" value="post">
                    Post
                </label>
                <label>
                    <input type="radio" name="preferred-contact" value="phone">
                    Phone
                </label>
            </fieldset>

            <div>
                <label for="product">Product</label>
                <select id="product" name="product" required>
                    <option value="pokemon-usb">Pokémon USB Drive</option>
                    <option value="extreme-usb">Extreme Encrypted USB Drive</option>
                    <option value="classic-usb-a">Classic USB-A Drive</option>
                </select>
            </div>

            <fieldset>
                <legend>Product features you're interested in</legend>
                <label>
                    <input type="checkbox" name="features" value="high-capacity" checked>
                    High-capacity storage
                </label>
                <label>
                    <input type="checkbox" name="features" value="encryption">
                    Hardware encryption
                </label>
                <label>
                    <input type="checkbox" name="features" value="fast-transfer">
                    Fast transfer speeds
                </label>
                <label>
                    <input type="checkbox" name="features" value="durable-design">
                    Durable/novelty design
                </label>
                <label>
                    <input type="checkbox" name="features" value="biometric-lock">
                    Biometric/password lock
                </label>
            </fieldset>

            <div>
                <label for="comment">Comment</label>
                <textarea id="comment" name="comment"
                    placeholder="Let us know if there's a particular aspect you're interested in..."></textarea>
            </div>

            <button type="submit" class="button-link">Submit enquiry</button>
        </form>
    </main>

    <!-- START footer -->
    <footer>
        &copy; 2026 Sandish Pty Ltd.
    </footer>
</body>

</html>
